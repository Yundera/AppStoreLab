# MailHub additions to the stock dovecot/dovecot 2.4 config.

# Roundcube and getmail talk to Dovecot over the app-private network only;
# the public listener is IMAPS.
auth_allow_cleartext = yes

# Plain LMTP for getmail6 deliveries (app-private network, not published).
service lmtp {
  inet_listener lmtp {
    port = 2424
  }
}

# An account set to deliver into its own folder (Settings → Mail accounts) is
# fetched to admin+<folder>: LMTP files it there, creating and subscribing the
# folder on first delivery.
lmtp_save_to_detail_mailbox = yes
lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes

# A folder named after a full address (pierre.henri@aptero.co) needs a second @:
# getmail sends to "admin+pierre.henri@aptero.co"@mailhub (a quoted local part).
# Dovecot then sees user admin@mailhub; keep only the user part, so it is the one
# mailbox. One mailbox per box, so no login can mean another user anyway.
auth_username_format = %{user | username | lower}

# Public IMAPS uses the certificate Maison writes to /tls (x-compose-app
# `certificates`); clients connect to the host it names, APP_TLS_HOST:993.
# Maison restarts this container when the certificate is renewed.
import_environment {
  MAILHUB_TLS_CERT = %{env:MAILHUB_TLS_CERT}
  MAILHUB_TLS_KEY = %{env:MAILHUB_TLS_KEY}
}
ssl_server {
  cert_file = $ENV:MAILHUB_TLS_CERT
  key_file = $ENV:MAILHUB_TLS_KEY
}
