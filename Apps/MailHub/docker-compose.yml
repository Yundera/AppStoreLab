name: mailhub
# MailHub — one mailbox for the mail accounts you already have.
# getmail6 fetches each provider over IMAP into a single Dovecot mailbox; Roundcube
# reads it and sends every identity through its own provider's SMTP. Calendar and
# contacts live in a built-in Baïkal (CalDAV/CardDAV only, no admin console), shown
# in Roundcube by the Kolab plugins and synced to phones; Settings can point them at
# another CalDAV/CardDAV server instead.
#
# The mailhub-roundcube / -getmail / -mcp images are built from github.com/worph/mailhub,
# which also holds the spike's test kit and notes.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SSO gate in front of the webmail.
  mailhub-proxy:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: mailhub
    hostname: mailhub
    restart: unless-stopped
    cpu_shares: 80
    logging: *logging
    user: "0:0"
    expose:
      - 80
    environment:
      BACKEND_HOST: mailhub-webmail
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - mailhub-webmail
    networks:
      - pcs
      - mailhub-internal

  mailhub-webmail:
    image: ghcr.io/worph/mailhub-roundcube:0.2.0
    container_name: mailhub-webmail
    restart: unless-stopped
    cpu_shares: 80
    logging: *logging
    expose:
      - 80
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailhub-imap
      ROUNDCUBEMAIL_DEFAULT_PORT: "31143"
      # identity_smtp needs a global SMTP to exist. It points nowhere on purpose:
      # an identity without its provider's SMTP must fail, not leave through a
      # server whose SPF/DMARC don't cover the address.
      ROUNDCUBEMAIL_SMTP_SERVER: "${MAILHUB_DEFAULT_SMTP:-localhost}"
      ROUNDCUBEMAIL_SMTP_PORT: "${MAILHUB_DEFAULT_SMTP_PORT:-587}"
      # mailhub_dav loads calendar + kolab_addressbook against the built-in Baïkal
      # (or another server set in Settings → Calendar & contacts).
      # mailhub_accounts: Settings → Mail accounts, writes the getmail files and
      # each address's identity + SMTP.
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,identity_smtp,mailhub_dav,mailhub_accounts
      ROUNDCUBEMAIL_DES_KEY: "${MAILHUB_DES_KEY}"
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      MAILHUB_DAV_DEBUG: "${MAILHUB_DAV_DEBUG:-}"
      TZ: Etc/UTC
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/db:/var/roundcube/db
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/config:/var/roundcube/config:ro
      # Settings → Mail accounts writes the fetched accounts and reads their status.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/getmail/accounts:/var/mailhub/accounts
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/getmail/state:/var/mailhub/fetch:ro
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mailhub-imap
      - mailhub-dav
    networks:
      - mailhub-internal

  mailhub-imap:
    image: dovecot/dovecot:2.4.5
    # Root for the master only, which reads the TLS certificate: Caddy stores it as
    # root 0600. Mail is still read and written as vmail (uid 1000).
    user: "0:0"
    container_name: mailhub-imap
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    environment:
      USER_PASSWORD: "${MAILHUB_PASSWORD}"
      MAILHUB_TLS_CERT: /certs/mailhub-${APP_PUBLIC_IP_DASH}.sslip.io.crt
      MAILHUB_TLS_KEY: /certs/mailhub-${APP_PUBLIC_IP_DASH}.sslip.io.key
      TZ: Etc/UTC
    ports:
      # IMAPS for phones and desktop clients (Thunderbird, iOS Mail, K-9).
      # Not HTTP, so the proxy cannot carry it.
      - "993:31993"
    expose:
      - 31143
      - 2424
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mail:/srv/vmail
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/dovecot/mailhub.conf:/etc/dovecot/conf.d/zz-mailhub.conf:ro
      # The Let's Encrypt certificate the platform Caddy gets for the app's sslip.io
      # route, mailhub-<ip>.sslip.io, which is also the IMAPS name. Not the
      # <domain> wildcard: it only exists once the box's zone is delegated, and
      # until then <app>.<domain> resolves to the gateway, not to this box.
      # On a fresh install Dovecot restarts until Caddy has issued it (~1 min).
      # A directory mount, so a renewal (new file) is visible after a reload.
      - ${DATA_ROOT:-/DATA}/AppData/mesh/data/caddy/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mailhub-${APP_PUBLIC_IP_DASH}.sslip.io:/certs:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mailhub-internal

  mailhub-fetch:
    image: ghcr.io/worph/mailhub-getmail:0.2.0
    container_name: mailhub-fetch
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    environment:
      FETCH_INTERVAL: "${MAILHUB_FETCH_INTERVAL:-300}"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/getmail/accounts:/config:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/getmail/state:/state
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - mailhub-imap
    networks:
      - mailhub-internal

  # Calendar & contacts (CalDAV/CardDAV). Routed WITHOUT AppShield: phone and
  # desktop DAV clients only speak Basic auth, so the mailbox login is the gate.
  # The nginx config serves /dav.php only — no admin console, no welcome page.
  mailhub-dav:
    image: ckulka/baikal:0.10.1-nginx
    container_name: mailhub-dav
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    expose:
      - 80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/config:/var/www/baikal/config
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/data:/var/www/baikal/Specific
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - pcs
      - mailhub-internal

  # MCP server: mail, calendar and contacts for AI assistants. Read-only unless
  # MAILHUB_MCP_WRITE=true; even then it only saves drafts, never sends.
  # App-private network only — Beacon reaches it through mailhub-beacon.
  mailhub-mcp:
    image: ghcr.io/worph/mailhub-mcp:0.2.0
    container_name: mailhub-mcp
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    expose:
      - 8080
    environment:
      MAILHUB_USER: admin
      MAILHUB_PASSWORD: "${MAILHUB_PASSWORD}"
      MAILHUB_MCP_WRITE: "${MAILHUB_MCP_WRITE:-false}"
      MAILHUB_ROUNDCUBE_DB: /roundcube/sqlite.db
    volumes:
      # Identities (name + address) only; SMTP passwords stay in Roundcube.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/db:/roundcube:ro
    deploy:
      resources:
        limits:
          memory: 192M
    depends_on:
      - mailhub-imap
      - mailhub-dav
    networks:
      - mailhub-internal

  # Announces the MCP server to Beacon (UDP discovery on the shared network) and
  # proxies /mcp to it. Tools appear in Beacon as mailhub__<tool>.
  mailhub-beacon:
    image: ghcr.io/worph/beaconify:1.0.2
    container_name: mailhub-beacon
    hostname: mailhub-beacon
    restart: unless-stopped
    cpu_shares: 20
    logging: *logging
    expose:
      - 9099
    environment:
      BEACONIFY_NAME: mailhub
      BEACONIFY_DESCRIPTION: "MailHub — the unified mailbox (search, read, drafts), calendar and contacts"
      BEACONIFY_UPSTREAM_URL: http://mailhub-mcp:8080/mcp
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - mailhub-mcp
    networks:
      - pcs
      - mailhub-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  mailhub-internal:
    driver: bridge

x-compose-app:
  schema_version: 2
  version: "0.1.0"
  # The first route is the web UI (webmail, behind SSO). The second is the
  # CalDAV/CardDAV endpoint for phones. IMAPS is a published port, not a route.
  routes:
    - { service: mailhub-proxy, name: mailhub, upstream-port: 80 }
    - { service: mailhub-dav, name: mailhubdav, upstream-port: 80 }
  id: mailhub
  title:
    en_us: MailHub
  tagline:
    en_us: All your mail accounts in one inbox, with calendar and contacts.
    fr_fr: Tous vos comptes mail dans une seule boîte, avec agenda et contacts.
  description:
    en_us: |
      MailHub gathers the mail accounts you already have — Gmail, your domain's mailbox,
      any IMAP provider — into one inbox on your server, and answers from the right address.

      **What it does**
      • Fetches every account over IMAP into one mailbox (optionally emptying the source)
      • Webmail (Roundcube) on any device, behind your server's single sign-on
      • Each address sends through its own provider's SMTP, so SPF and DMARC stay valid
      • IMAPS for Thunderbird and phone mail apps
      • Calendar and contacts built in: invitations get Accept / Maybe / Decline and land
        in your calendar, and both sync to your phone (CalDAV / CardDAV)
      • AI access (MCP) through Beacon: search and read mail, calendar, contacts —
        read-only by default; drafts only, never sends

      MailHub does not receive mail for a domain by itself (no MX): it collects from the
      providers you keep using.
    fr_fr: |
      MailHub rassemble les comptes mail que vous avez déjà — Gmail, la boîte de votre
      domaine, tout fournisseur IMAP — dans une seule boîte sur votre serveur, et répond
      depuis la bonne adresse.

      **Ce qu'il fait**
      • Relève chaque compte en IMAP dans une boîte unique (et peut vider la source)
      • Webmail (Roundcube) sur tous vos appareils, derrière la connexion unique du serveur
      • Chaque adresse envoie par le SMTP de son fournisseur : SPF et DMARC restent valides
      • IMAPS pour Thunderbird et les applis mail du téléphone
      • Agenda et contacts intégrés : les invitations ont Accepter / Peut-être / Refuser
        et arrivent dans l'agenda, et tout se synchronise sur le téléphone (CalDAV / CardDAV)
      • Accès IA (MCP) via Beacon : chercher et lire les mails, agenda, contacts —
        lecture seule par défaut ; brouillons seulement, jamais d'envoi

      MailHub ne reçoit pas de mail pour un domaine (pas de MX) : il relève chez les
      fournisseurs que vous gardez.
  developer: Yundera
  category: Email
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
  # IMAPS (993) is published on the host's public address.
  requires: [public-ip]
  secrets:
    MAILHUB_PASSWORD: password:24       # the mailbox login: webmail, IMAPS, CalDAV/CardDAV
    MAILHUB_DAV_ADMIN_PASSWORD: hex:32  # Baïkal's admin hash only; its console is not served
    MAILHUB_DES_KEY: alnum:24           # Roundcube's key for stored SMTP passwords
  folders:
    - path: /DATA/AppData/$AppID/mail
      user: "1000"                      # dovecot image's vmail
      group: "1000"
      mode: "0700"
    - path: /DATA/AppData/$AppID/roundcube/db
      user: "33"                        # www-data
      group: "33"
    # getmail runs as uid 33, www-data in the webmail, which writes the accounts
    # (they hold the providers' app passwords, hence 0700). Recursive: account
    # files dropped in by hand, and installs from before 0.2.0 (uid 1000).
    - path: /DATA/AppData/$AppID/getmail/accounts
      user: "33"
      group: "33"
      mode: "0700"
      recursive: true
    - path: /DATA/AppData/$AppID/getmail/state
      user: "33"
      group: "33"
      recursive: true
    - path: /DATA/AppData/$AppID/baikal/config
      user: "101"                       # the Baïkal image's nginx (its entrypoint chowns to it)
      group: "101"
    - path: /DATA/AppData/$AppID/baikal/data
      user: "101"
      group: "101"
  # Backups: Maison snapshots the whole app folder (stopping the app for the short
  # second pass, so the SQLite DBs and Maildir are consistent). Nothing here is a
  # regenerable cache, so nothing is excluded: mail/, baikal/data/, roundcube/db/,
  # .env (the secrets, including the key Roundcube encrypts SMTP passwords with)
  # and getmail/state/ (which messages were already fetched — without it, every
  # message still on a provider is fetched again).
  # App-managed config, re-rendered on every up so an update reaches existing
  # installs (seed/ alone is create-if-absent). Edit the store copy, not these.
  files:
    - path: /DATA/AppData/$AppID/roundcube/config/mailhub.inc.php
      from: roundcube/config/mailhub.inc.php
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/dovecot/mailhub.conf
      from: dovecot/mailhub.conf
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/baikal/nginx.conf
      from: baikal/nginx.conf
      ensure: always
      mode: "0644"
  steps:
    # Baïkal's config and DB (the `admin` account with one calendar and one address
    # book) are written on the first up; every later up re-syncs the account's
    # password with the mailbox's, so a credential change reaches CalDAV/CardDAV.
    - name: baikal-init
      at: setup
      run: always
      images: [ckulka/baikal:0.10.1-nginx]
      script: |
        # Bare -e NAME: the values never appear on a command line.
        export BAIKAL_USER_PASSWORD="$MAILHUB_PASSWORD" BAIKAL_ADMIN_PASSWORD="$MAILHUB_DAV_ADMIN_PASSWORD"
        docker run --rm --network none --entrypoint php \
          -e BAIKAL_USER=admin -e BAIKAL_USER_PASSWORD -e BAIKAL_ADMIN_PASSWORD \
          -v "$APP_DIR/.scripts/baikal-init.php:/init/init.php:ro" \
          -v "$APP_DIR/baikal/config:/var/www/baikal/config" \
          -v "$APP_DIR/baikal/data:/var/www/baikal/Specific" \
          ckulka/baikal:0.10.1-nginx /init/init.php
  credentials:
    - label:
        en_us: Mailbox (webmail, IMAPS, calendar & contacts)
        fr_fr: Boîte mail (webmail, IMAPS, agenda et contacts)
      username: admin
      password: ${MAILHUB_PASSWORD}
      note:
        en_us: The same login opens the webmail (after your server sign-in), IMAPS on mailhub.${APP_DOMAIN}:993 and calendar & contacts sync on https://mailhubdav.${APP_DOMAIN}/dav.php.
        fr_fr: Le même identifiant ouvre le webmail (après la connexion au serveur), l'IMAPS sur mailhub.${APP_DOMAIN}:993 et la synchro agenda et contacts sur https://mailhubdav.${APP_DOMAIN}/dav.php.
      # Dovecot reads it from the environment on every start, and the baikal-init
      # step re-syncs Baïkal's copy on every up; Roundcube stores none.
      change:
        apply: env
  tips:
    en_us: |
      **Signing in**
      Open the app, sign in with your server account, then log into the webmail with
      the mailbox login shown under *Credentials*.

      **Phone and desktop clients**

      | | |
      | --- | --- |
      | IMAP server | `mailhub-${APP_PUBLIC_IP_DASH}.sslip.io`, port 993, SSL/TLS |
      | IMAP user | `admin` + the mailbox password |
      | Calendar & contacts (CalDAV / CardDAV) | `https://mailhubdav-${APP_PUBLIC_IP_DASH}.sslip.io/dav.php`, same login |
      | Sending (SMTP) | your provider's own SMTP for each address |

      These addresses contain your server's IP: if it ever changes, update them on your devices.

      Android: DAVx⁵ → *Login with URL and user name*. iPhone: Settings → Calendar →
      Accounts → Other → *Add CalDAV Account* (and CardDAV under Contacts), server
      `mailhubdav-${APP_PUBLIC_IP_DASH}.sslip.io`.

      **Adding your mail accounts**
      Webmail → Settings → *Mail accounts*: pick the provider (Gmail, Namecheap
      Private Email, or another one), enter the address and an app password. MailHub
      tests the login, starts fetching within a minute, and sets up the address so
      your replies leave through that provider. Leave *Delete from the provider* off
      until your backups cover the app.

      **Calendar and contacts** are built in — nothing to set up. To keep them on
      another CalDAV/CardDAV server (Nextcloud…), Webmail → Settings → *Calendar &
      contacts*.

      **AI assistants (MCP)**
      With the **Beacon** app installed, MailHub's tools appear there on their own
      (`mailhub__mail_search`, `mailhub__calendar_events`, …). They are read-only.
      To let the assistant file mail, save drafts and add events or contacts, set
      `MAILHUB_MCP_WRITE=true` in the app's settings (Env). It never sends mail:
      drafts wait in *Drafts* for you to send from the webmail.
    fr_fr: |
      **Connexion**
      Ouvrez l'app, connectez-vous avec votre compte serveur, puis au webmail avec
      l'identifiant de la boîte affiché sous *Identifiants*.

      **Téléphone et clients mail**

      | | |
      | --- | --- |
      | Serveur IMAP | `mailhub-${APP_PUBLIC_IP_DASH}.sslip.io`, port 993, SSL/TLS |
      | Utilisateur IMAP | `admin` + le mot de passe de la boîte |
      | Agenda et contacts (CalDAV / CardDAV) | `https://mailhubdav-${APP_PUBLIC_IP_DASH}.sslip.io/dav.php`, même identifiant |
      | Envoi (SMTP) | le SMTP de chaque fournisseur |

      Ces adresses contiennent l'IP de votre serveur : si elle change, mettez-les à jour sur vos appareils.

      Android : DAVx⁵ → *Connexion avec URL et nom d'utilisateur*. iPhone : Réglages →
      Calendrier → Comptes → Autre → *Ajouter un compte CalDAV* (et CardDAV dans
      Contacts), serveur `mailhubdav-${APP_PUBLIC_IP_DASH}.sslip.io`.

      **Ajouter vos comptes mail**
      Webmail → Paramètres → *Comptes mail* : choisissez le fournisseur (Gmail,
      Namecheap Private Email ou un autre), saisissez l'adresse et un mot de passe
      d'application. MailHub teste la connexion, commence la relève dans la minute et
      configure l'adresse pour que vos réponses partent via ce fournisseur. Laissez
      *Supprimer chez le fournisseur* désactivé tant que vos sauvegardes ne couvrent pas l'app.

      **L'agenda et les contacts** sont intégrés — rien à configurer. Pour les garder
      sur un autre serveur CalDAV/CardDAV (Nextcloud…), Webmail → Paramètres →
      *Agenda et contacts*.

      **Assistants IA (MCP)**
      Avec l'app **Beacon** installée, les outils de MailHub y apparaissent tout seuls
      (`mailhub__mail_search`, `mailhub__calendar_events`, …), en lecture seule. Pour
      permettre de classer les mails, enregistrer des brouillons et ajouter des
      événements ou contacts, mettez `MAILHUB_MCP_WRITE=true` dans les réglages de
      l'app (Env). Rien n'est jamais envoyé : les brouillons attendent dans
      *Brouillons* que vous les envoyiez depuis le webmail.

x-casaos:
  store_app_id: mailhub
  architectures:
    - amd64
  main: mailhub-proxy
  webui_port: 80
  index: /
  category: Email
  tags: ["email", "productivity", "needs-public-ip"]
  developer: Yundera
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: MailHub
  tagline:
    en_us: All your mail accounts in one inbox, with calendar and contacts.
    fr_fr: Tous vos comptes mail dans une seule boîte, avec agenda et contacts.
  description:
    en_us: |
      MailHub gathers the mail accounts you already have — Gmail, your domain's mailbox,
      any IMAP provider — into one inbox on your server, and answers from the right address.
      Webmail behind single sign-on, per-address SMTP, IMAPS, and built-in calendar,
      invitations and contacts synced to your phone. No MX.
    fr_fr: |
      MailHub rassemble les comptes mail que vous avez déjà dans une seule boîte sur votre
      serveur, et répond depuis la bonne adresse. Webmail derrière la connexion unique,
      SMTP par adresse, IMAPS, et agenda, invitations et contacts intégrés et
      synchronisés sur le téléphone. Pas de MX.
  tips:
    before_install:
      en_us: |
        The mailbox login (webmail, IMAPS, calendar & contacts) is shown under Credentials.
        Phones: IMAP mailhub-<your server's IP>.sslip.io:993, CalDAV/CardDAV https://mailhubdav-<your server's IP>.sslip.io/dav.php (shown in the tips after install).
        Add the accounts to fetch in the webmail: Settings → Mail accounts.
